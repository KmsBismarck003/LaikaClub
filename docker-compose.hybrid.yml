    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker

  merchandise:
    build: .
    container_name: laika_merchandise_hybrid
    ports:
      - "8203:8203"
    command: uvicorn microservices.merchandise.main:app --host 0.0.0.0 --port 8203
    environment:
      - PYTHONPATH=/app
    extra_hosts:
