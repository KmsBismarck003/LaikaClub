      - "8202:8202"
    command: uvicorn microservices.tickets.main:app --host 0.0.0.0 --port 8202
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker

  stats:
    build: .
    container_name: laika_stats_hybrid
    ports:
      - "8103:8103"
    command: uvicorn microservices.stats.main:app --host 0.0.0.0 --port 8103
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker

  admin:
    build: .
    container_name: laika_admin_hybrid
    ports:
      - "8102:8102"
    command: uvicorn microservices.admin.main:app --host 0.0.0.0 --port 8102
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker

  achievements:
    build: .
    container_name: laika_achievements_hybrid
    ports:
      - "8301:8301"
    command: uvicorn microservices.achievements.main:app --host 0.0.0.0 --port 8301
