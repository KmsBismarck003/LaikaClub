  <text x="70" y="228" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">Web Publica — Compradores</text>
  <text x="70" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">laika-admin — Administracion</text>
  <text x="70" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">laika-gestor — Organizadores</text>
  <text x="70" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">laika-operador — Escaneo QR</text>
  <text x="70" y="300" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">matis-solid — Tablero BI</text>

