  <text x="352" y="134" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#15803d" letter-spacing="0.8">MICROSOFT AZURE — TERRAFORM · VNET 10.0.0.0/16 · SUBRED 10.0.1.0/24</text>
