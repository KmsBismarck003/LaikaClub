  <text x="374" y="312" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b45309">Allow SSH    22</text>
  <text x="374" y="332" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#475569">Llave SSH RSA 4096</text>

  <line x1="439" y1="346" x2="439" y2="374" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)"/>

