  <text x="376" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#e2e8f0">Soporte WebSocket</text>

  <rect x="364" y="548" width="150" height="90" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
