  <text x="40" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Convivencia entre Vercel, LaikaMobil, GitHub Actions y Microsoft Azure</text>
  <line x1="40" y1="86" x2="1240" y2="86" stroke="#e2e8f0" stroke-width="1.5"/>

