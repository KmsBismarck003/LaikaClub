  <text x="376" y="420" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#99f6e4">TLS Certbot + Gzip</text>
  <line x1="376" y1="432" x2="502" y2="432" stroke="rgba(255,255,255,0.25)"/>
