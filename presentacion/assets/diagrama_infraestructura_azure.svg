  <rect x="56" y="498" width="204" height="5" rx="2" fill="#b45309"/>
  <text x="70" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">GitHub Actions</text>
  <text x="70" y="542" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#b45309">Pipeline CI y CD</text>
