  <text x="70" y="446" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">SSL Pinning hacia Azure HTTPS</text>
  <text x="70" y="464" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155">Boveda QR y sincronizacion</text>

