server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Compresión Gzip activada
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. API GATEWAY PILGRIM (FastAPI en puerto 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. ARCHIVOS MULTIMEDIA / UPLOADS (Banners, QRs, imágenes)
    location /uploads/ {
        alias /app/laika/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. ROL ADMINISTRADOR (laika-admin)
    location /admin/ {
        alias /var/www/laika-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 4. ROL GESTOR / ORGANIZADOR (laika-gestor)
    location /gestor/ {
        alias /var/www/laika-gestor/;
        index index.html;
        try_files $uri $uri/ /gestor/index.html;
    }

    # 5. ROL OPERADOR / STAFF DE ENTRADA (laika-operador)
    location /operador/ {
        alias /var/www/laika-operador/;
        index index.html;
        try_files $uri $uri/ /operador/index.html;
    }

    # 6. PORTAL WEB PRINCIPAL (Clientes y compras de boletos)
    location / {
        root /var/www/laika-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
